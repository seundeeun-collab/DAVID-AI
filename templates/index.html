<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Code Transformer</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body><main><header><span class="tag">LOCAL AI · DECODER TRANSFORMER</span><h1>Your Python coding lab</h1><p>Write a request, then let your locally trained model continue it as Python.</p></header><section class="card"><label for="prompt">What should the code do?</label><textarea id="prompt" rows="4">Write a function to add two numbers</textarea><div class="actions"><button id="generate">Generate Code</button><span id="status" role="status">Ready</span></div></section><section class="card"><div class="codehead"><label for="code">Generated Python</label><div><button class="secondary" id="copy">Copy</button><button class="secondary" id="clear">Clear</button></div></div><textarea id="code" rows="13" spellcheck="false" placeholder="Your model's code will appear here…"></textarea><button id="run" class="secondary">Run Code</button><pre id="result">Run output will appear here.</pre></section><section class="card"><h2>Recent prompts</h2><ol id="history"></ol></section><footer>Runs locally at 127.0.0.1. The Run button allows a small Python subset for this learning demo.</footer></main><script src="{{ url_for('static',filename='app.js') }}"></script></body></html>
